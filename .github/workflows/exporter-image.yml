# Builds the Prometheus exporter image and publishes it to GHCR.
#
# Multi-arch matters here rather than being a nicety: a mixed amd64/arm64
# cluster will happily schedule the pod onto an arm64 node, and a
# single-arch image just fails to pull there with no obvious clue why.
name: exporter images

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile"
      - ".github/workflows/exporter-image.yml"
  # Releases publish an immutable :vX.Y.Z alongside the rolling :main.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: one exporter failing to build is not a reason to skip
      # publishing the other, which may be the one that was actually fixed.
      fail-fast: false
      matrix:
        exporter: [pr60x-exporter, xs508tm-exporter]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Cheap gate: the client's RPC-method-name test exists because a
      # mechanical rename once rewrote the method-name string literals and
      # shipped "GetDeviceInfo" to a device that only answers "getDeviceInfo".
      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.exporter }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EXPORTER=${{ matrix.exporter }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope the cache per exporter; a shared scope makes the second
          # build in the matrix restore the first one's layers and rebuild
          # anyway, which is slower than no cache at all.
          cache-from: type=gha,scope=${{ matrix.exporter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.exporter }}
